<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SITE_NAME}} - 网址导航</title>
  <meta name="description" content="{{SITE_DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{SITE_NAME}}">
  <meta property="og:title" content="{{SITE_NAME}} - 网址导航">
  <meta property="og:description" content="{{SITE_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_IMAGE_URL}}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{SITE_NAME}} - 网址导航">
  <meta name="twitter:description" content="{{SITE_DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE_URL}}">
  <link rel="icon" href="/favicon.svg?v=148aafdf" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css?v=89b6c9f00d23cf1cc1a3220218d66375">
  <script>
    // Init Theme ASAP to prevent FOUC
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
    // 侧栏宽度 / 底色 / 字体颜色 / 字号、图标栏对齐 / 大小 / 间距：页面绘制前先从
    // localStorage 恢复，避免闪烁（与 home-category-nav.js 里的设置同一组 key）
    try {
      var _sbw = parseInt(localStorage.getItem('iori_sidebar_width_v1') || '256', 10);
      if (_sbw >= 200 && _sbw <= 320) document.documentElement.style.setProperty('--sidebar-w', _sbw + 'px');
      var _sbbg = localStorage.getItem('iori_sidebar_bg_v1') || 'default';
      if (['white', 'gray', 'dark'].indexOf(_sbbg) >= 0) document.documentElement.setAttribute('data-sidebar-bg', _sbbg);
      var _sbfc = localStorage.getItem('iori_sidebar_font_color_v1') || 'default';
      if (['gray', 'blue', 'white'].indexOf(_sbfc) >= 0) document.documentElement.setAttribute('data-sidebar-font-color', _sbfc);
      var _sbfs = parseInt(localStorage.getItem('iori_sidebar_font_size_v1') || '14', 10);
      if (_sbfs >= 13 && _sbfs <= 18) document.documentElement.style.setProperty('--sidebar-font-size', _sbfs + 'px');
      var _dka = localStorage.getItem('iori_dock_align_v1') || 'center';
      if (['left', 'right'].indexOf(_dka) >= 0) document.documentElement.setAttribute('data-dock-align', _dka);
      var _dks = parseInt(localStorage.getItem('iori_dock_size_v1') || '64', 10);
      if (_dks >= 48 && _dks <= 80) document.documentElement.style.setProperty('--dock-icon-size', _dks + 'px');
      var _dkg = parseInt(localStorage.getItem('iori_dock_gap_v1') || '16', 10);
      if (_dkg >= 8 && _dkg <= 32) document.documentElement.style.setProperty('--dock-gap', _dkg + 'px');
      var _dkfc = localStorage.getItem('iori_dock_font_color_v1') || 'default';
      if (['gray', 'blue', 'white'].indexOf(_dkfc) >= 0) document.documentElement.setAttribute('data-dock-font-color', _dkfc);
      var _shd = localStorage.getItem('iori_search_hidden_v1');
      if (_shd === '1') document.documentElement.setAttribute('data-search-hidden', '1');
    } catch (e) { /* 隐私模式等读不到时静默忽略，用默认样式 */ }
  </script>
  <link rel="stylesheet" href="/css/tailwind.min.css?v=eb523845">
</head>
<body class="bg-secondary-50 font-sans text-gray-800">
  <!-- SVG sprite: 高频复用图标在此定义一次，卡片等处通过 <use href="#icon-xxx"/> 引用 -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
      <path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/>
    </symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
      <path d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
    </symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
      <path d="M19 9l-7 7-7-7"/>
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
      <path d="M9 5l7 7-7 7"/>
    </symbol>
  </svg>
  <input type="checkbox" id="sidebar-toggle" class="hidden">
  
  <!-- 左上角操作区 (移动端导航按钮) -->
  {{LEFT_TOP_ACTION}}

  <!-- 右上角操作区 (主题切换, 后台入口) -->
  {{RIGHT_TOP_ACTION}}
  
  <div id="mobileOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 mobile-overlay lg:hidden"></div>
  
  <!-- 桌面侧边栏开关按钮 -->
  <div id="sidebarDesktopToggleWrap" class="fixed top-4 left-4 z-50 hidden lg:block {{SIDEBAR_TOGGLE_CLASS}}">
    <label for="sidebar-toggle" class="p-2 rounded-lg bg-white shadow-md hover:bg-gray-100 inline-block cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-primary-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </label>
  </div>
  
  <!-- 侧边栏 -->
  <aside id="sidebar" class="sidebar sidebar-mode-botab fixed left-0 top-0 h-full bg-white dark:bg-gray-900 shadow-md border-r border-primary-100/60 dark:border-gray-800 z-50 overflow-y-auto mobile-sidebar lg:transform-none transition-all duration-300 {{SIDEBAR_CLASS}}">
    <div class="p-6">
      <div class="flex items-center justify-end mb-8">
        <button id="closeSidebar" class="p-1 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 lg:hidden">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500 dark:text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
        <label for="sidebar-toggle" class="p-1 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 hidden lg:block cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500 dark:text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </label>
      </div>
      
      <div>
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">分类导航</h3>
          <div id="sidebarExpandCollapseWrap" class="flex items-center gap-2 text-xs">
            <button id="sidebarExpandAllBtn" type="button" class="text-gray-500 hover:text-primary-600 dark:text-gray-400 dark:hover:text-primary-400 transition-colors">全部展开</button>
            <span class="text-gray-300 dark:text-gray-600">|</span>
            <button id="sidebarCollapseAllBtn" type="button" class="text-gray-500 hover:text-primary-600 dark:text-gray-400 dark:hover:text-primary-400 transition-colors">全部折叠</button>
          </div>
        </div>
        <div id="sidebarModeToggle" class="sidebar-mode-toggle hidden lg:flex items-center gap-1 mb-3 p-1 rounded-lg bg-gray-100 dark:bg-gray-800 text-xs">
          <button id="sidebarModeBotabBtn" type="button" class="sidebar-mode-btn flex-1 py-1 rounded-md transition-colors">小舒</button>
          <button id="sidebarModeTreeBtn" type="button" class="sidebar-mode-btn flex-1 py-1 rounded-md transition-colors">树形</button>
        </div>
        <div class="space-y-1">
          <div class="sidebar-tree-row sidebar-top-row flex items-center">
            <button id="sidebarBackToTop" type="button" class="flex items-center px-3 py-2 rounded-lg flex-1 min-w-0 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-gray-400 dark:text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 11l7-7 7 7M5 19l7-7 7 7" />
              </svg>
              <span class="sidebar-tree-name truncate">回到顶部</span>
            </button>
          </div>
          <div class="sidebar-tree-row sidebar-top-row flex items-center">
            <a href="?catalog=all" class="sidebar-tree-link flex items-center px-3 py-2 rounded-lg flex-1 min-w-0 transition-colors duration-200 {{ALL_LINK_CLASS}}">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 flex-shrink-0 {{ALL_LINK_ICON_CLASS}}" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
              </svg>
              <span class="sidebar-tree-name truncate">全部收藏</span>
            </a>
            <span class="sidebar-tree-count" title="{{TOTAL_SITES}} 个书签">{{TOTAL_SITES}}</span>
          </div>
          <div id="sidebarTreeWrap">{{CATALOG_LINKS}}</div>
          <div id="sidebarBotabWrap">{{CATALOG_LINKS_BOTAB}}</div>
        </div>
      </div>
      
      <div class="mt-8 pt-6 border-t border-gray-200 dark:border-gray-800">
        <div class="{{SUBMISSION_CLASS}}">
          <button id="addSiteBtnSidebar" class="w-full flex items-center justify-center px-4 py-2 bg-accent-500 text-white rounded-lg hover:bg-accent-600 transition duration-300 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            添加新书签
          </button>
        </div>
        
        
        <button id="sidebarSettingsBtn" type="button" class="mt-2 flex w-full items-center px-4 py-2 text-gray-600 dark:text-gray-400 hover:text-primary-500 dark:hover:text-primary-400 transition duration-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          侧栏设置
        </button>
        <div id="sidebarSettingsPanel" class="hidden mt-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 p-3 text-sm">
          <div class="flex items-center justify-between mb-1">
            <label for="sidebarWidthRange" class="text-gray-700 dark:text-gray-300">侧栏宽度</label>
            <span id="sidebarWidthValue" class="text-xs text-gray-500 dark:text-gray-400">256px</span>
          </div>
          <input id="sidebarWidthRange" type="range" min="200" max="320" step="4" value="256" class="w-full accent-blue-500" aria-label="侧栏宽度">
          <div class="mt-3 mb-1 text-gray-700 dark:text-gray-300">侧栏底色</div>
          <div id="sidebarBgSwatches" class="flex items-center gap-2">
            <button type="button" data-sidebar-bg="default" class="sidebar-bg-swatch flex-1 py-1 rounded-md border text-xs transition-colors" title="默认">默认</button>
            <button type="button" data-sidebar-bg="white" class="sidebar-bg-swatch flex-1 py-1 rounded-md border text-xs transition-colors" title="白色">白色</button>
            <button type="button" data-sidebar-bg="gray" class="sidebar-bg-swatch flex-1 py-1 rounded-md border text-xs transition-colors" title="浅灰">浅灰</button>
            <button type="button" data-sidebar-bg="dark" class="sidebar-bg-swatch flex-1 py-1 rounded-md border text-xs transition-colors" title="深色">深色</button>
          </div>
          <div class="mt-3 mb-1 text-gray-700 dark:text-gray-300">字体颜色</div>
          <div id="sidebarFontColorSwatches" class="flex items-center gap-2">
            <button type="button" data-sidebar-font-color="default" class="sidebar-font-swatch flex-1 py-1 rounded-md border text-xs transition-colors" title="默认（按底色自动配）">默认</button>
            <button type="button" data-sidebar-font-color="gray" class="sidebar-font-swatch flex-1 py-1 rounded-md border text-xs transition-colors" title="深灰">深灰</button>
            <button type="button" data-sidebar-font-color="blue" class="sidebar-font-swatch flex-1 py-1 rounded-md border text-xs transition-colors" title="蓝色">蓝色</button>
            <button type="button" data-sidebar-font-color="white" class="sidebar-font-swatch flex-1 py-1 rounded-md border text-xs transition-colors" title="白色">白色</button>
          </div>
          <div class="mt-3 flex items-center justify-between mb-1">
            <label for="sidebarFontSizeRange" class="text-gray-700 dark:text-gray-300">字体大小</label>
            <span id="sidebarFontSizeValue" class="text-xs text-gray-500 dark:text-gray-400">14px</span>
          </div>
          <input id="sidebarFontSizeRange" type="range" min="13" max="18" step="1" value="14" class="w-full accent-blue-500" aria-label="字体大小">
        </div>

        <a href="/admin" target="_blank" class="mt-2 flex items-center px-4 py-2 text-gray-600 dark:text-gray-400 hover:text-primary-500 dark:hover:text-primary-400 transition duration-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
          后台管理
        </a>
      </div>
    </div>
  </aside>
  
  <!-- 主内容区 -->
  <main class="main-content {{MAIN_CLASS}} min-h-screen transition-all duration-300">
    <header class="{{HEADER_CLASS}} text-white py-4 px-6 md:px-10 shadow-sm">
      {{HEADER_CONTENT}}
    </header>

    {{ROOT_STRIP}}

    <div class="home-stats-row max-w-7xl mx-auto px-4 sm:px-6 {{STATS_ROW_PY_CLASS}}">
      {{SUB_CAPSULES}}
    </div>
    
    <section class="max-w-7xl mx-auto px-4 sm:px-6 pb-12">
      <div class="{{CONTAINER_CLASS}} p-4 sm:p-6">
        <div id="sitesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6">
          {{SITES_GRID}}
        </div>
      </div>
    </section>
    
    <footer class="{{FOOTER_CLASS}}">
      <div class="max-w-5xl mx-auto text-center">
        <div class="flex justify-center items-center space-x-4">
          <a href="https://github.com/mangguo88/iori-nav01" target="_blank" class="flex items-center hover:text-primary-500 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>
            <span>Github</span>
          </a>
          <span class="text-gray-300">|</span>
          <p>© {{CURRENT_YEAR}} {{FOOTER_TEXT}}</p>
        </div>
      </div>
    </footer>
  </main>
  
  <button id="backToTop" class="fixed bottom-8 right-8 p-3 rounded-full bg-accent-500 text-white shadow-lg opacity-0 invisible transition-all duration-300 hover:bg-accent-600">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 11l7-7 7 7M5 19l7-7 7 7" />
    </svg>
  </button>
  <button type="button" id="addSiteBtnFloating" class="{{SUBMISSION_CLASS}} fixed bottom-24 right-8 z-40 hidden min-[550px]:flex p-3 rounded-full bg-accent-500 text-white shadow-lg hover:bg-accent-600 transition-all duration-300 hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-accent-400 focus:ring-offset-2" title="公开投稿" aria-label="公开投稿">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14M5 12h14" />
    </svg>
  </button>
  
  <!-- 添加网站模态框 -->
  <div id="addSiteModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 opacity-0 invisible transition-all duration-300">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 transform translate-y-8 transition-all duration-300">
      <div class="p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold text-gray-900">添加新书签</h2>
          <button id="closeModal" class="text-gray-400 hover:text-gray-500">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        
        <form id="addSiteForm" class="space-y-4">
          <div>
            <label for="addSiteName" class="block text-sm font-medium text-gray-700">名称</label>
            <input type="text" id="addSiteName" required class="mt-1 block w-full px-3 py-2 border border-primary-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-200 focus:border-primary-400">
          </div>
          
          <div>
            <label for="addSiteUrl" class="block text-sm font-medium text-gray-700">网址</label>
            <input type="text" id="addSiteUrl" required class="mt-1 block w-full px-3 py-2 border border-primary-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-200 focus:border-primary-400">
          </div>
          
          <div>
            <label for="addSiteLogo" class="block text-sm font-medium text-gray-700">Logo (可选)</label>
            <input type="text" id="addSiteLogo" class="mt-1 block w-full px-3 py-2 border border-primary-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-200 focus:border-primary-400">
          </div>
          
          <div>
            <label for="addSiteDesc" class="block text-sm font-medium text-gray-700">描述 (可选)</label>
            <textarea id="addSiteDesc" rows="2" class="mt-1 block w-full px-3 py-2 border border-primary-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-200 focus:border-primary-400"></textarea>
          </div>
          
          <div>
            <label for="addSiteCatelog" class="block text-sm font-medium text-gray-700">分类</label>
            <select id="addSiteCatelog" required class="mt-1 block w-full px-3 py-2 border border-primary-100 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-200 focus:border-primary-400 bg-white">
              <option value="" disabled selected>加载中...</option>
            </select>
          </div>

          <div id="addSiteTurnstile" class="hidden justify-center" style="min-height: 65px;"></div>

          <div id="addSiteMessage" class="hidden rounded-lg border px-3 py-2 text-sm leading-relaxed"></div>
          
          <div class="flex justify-end pt-4">
            <button type="button" id="cancelAddSite" class="bg-white py-2 px-4 border border-primary-100 rounded-md shadow-sm text-sm font-medium text-primary-600 hover:bg-secondary-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-200 mr-3">
              取消
            </button>
            <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-accent-500 hover:bg-accent-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent-400">
              提交
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <script src="/js/home-ui.js?v=3abb97c5"></script>
  <script src="/js/home-cards.js?v=40ca9931"></script>
